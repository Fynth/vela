[package]
name = "vela-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
native-qa = []

[[example]]
name = "native-ui-qa"
required-features = ["native-qa"]

[dependencies]
vela-domain.workspace = true
dioxus = { workspace = true, features = ["desktop"] }
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
uuid.workspace = true
blake3.workspace = true
base64 = "=0.22.1"
futures-util.workspace = true
tempfile.workspace = true
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "=0.10.0", features = ["tokio"] }

[dev-dependencies]
vela-server = { path = "../server", version = "0.12.0" }
vela-core.workspace = true
axum.workspace = true
