name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  packages:
    uses: ./.github/workflows/desktop-platforms.yml
    secrets: inherit
  verify:
    needs: [quality, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The release scripts read the commit, the version and the tag from
          # the history, so a shallow copy is not enough.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: target/release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: aur-validated
          path: target/release-artifacts/aur
      - name: Verify complete artifact set and tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 scripts/verify_release_artifacts.py --require-all
          python3 - <<'PY'
          import json, os, pathlib
          r = json.loads(pathlib.Path('target/release-artifacts/release-report.json').read_text())
          assert r['commit'] == os.environ['GITHUB_SHA'], 'artifacts name a different commit'
          if os.environ['IS_TAG'] == 'true':
              assert os.environ['RELEASE_TAG'] == 'v' + r['version'], 'tag does not match Cargo version'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-verified
          path: target/release-artifacts/
          include-hidden-files: true
          if-no-files-found: error
  github-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-verified
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.apk
            release-assets/*.sha256
            release-assets/SHA256SUMS
            release-assets/release-report.json
            release-assets/aur/PKGBUILD
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Linux deb/tar/AppImage target Ubuntu 24.04+ with GTK3, WebKitGTK 4.1, ALSA, libudev and libxdo.so.3. The AppImage uses these host libraries. Current Arch users should use vela-music-bin, which carries its private compatible libxdo library.
            Windows requires the WebView2 runtime. Executables have no Authenticode signature.
            Android arm64 APK is a preview; device audio/background behavior is not certified. A filename ending in -preview.apk uses a temporary CI signing key and may require reinstalling between builds. Stable APK signing uses the repository Android keystore secrets.
            AUR installation: yay -S vela-music-bin (available after the separate AUR publish job succeeds).
  aur:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The release scripts read the commit, the version and the tag from
          # the history, so a shallow copy is not enough.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-verified
          path: target/release-artifacts
      - name: Publish validated AUR recipe after release assets exist
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_REPO: ${{ vars.AUR_REPO }}
          AUR_KNOWN_HOSTS: ${{ vars.AUR_KNOWN_HOSTS }}
        run: bash release/channels/aur.sh target/release-artifacts/aur vela-music-bin
