name: packages
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  linux:
    name: Linux tar.gz, deb, AppImage and AUR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The release scripts read the commit, the version and the tag from
          # the history, so a shallow copy is not enough.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-release.txt
      - name: Native build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libudev-dev libxdo-dev dpkg-dev squashfs-tools
      - name: Install AppImage tool without requiring FUSE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          gh release download continuous --repo AppImage/appimagetool --pattern appimagetool-x86_64.AppImage --dir "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          echo '95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6  appimagetool-x86_64.AppImage' | sha256sum -c
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract > /dev/null
          ln -s "$RUNNER_TEMP/appimage/squashfs-root/AppRun" "$RUNNER_TEMP/appimage/appimagetool"
          echo "$RUNNER_TEMP/appimage" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Build portable archives
        run: python3 scripts/release_build.py --only server-linux-x86-64 web-linux-x86-64 desktop-linux-x86-64
      - name: Build required Linux packages
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          export VELA_RELEASE_BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          python3 scripts/release_packages.py --only deb --only appimage --only aur
      - name: Verify package payloads and launch entry points
        run: |
          python3 scripts/verify_release_artifacts.py
          python3 scripts/verify_package.py target/release-artifacts/vela-server-*.tar.gz
          python3 scripts/verify_shutdown.py --runs 10 --worker-failure
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb --extract target/release-artifacts/*.deb "$RUNNER_TEMP/deb"
          "$RUNNER_TEMP/deb/usr/bin/vela-desktop" --version
          chmod +x target/release-artifacts/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 target/release-artifacts/*.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: target/release-artifacts/
          if-no-files-found: error
  aur-check:
    name: Build AUR recipe using makepkg
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: /tmp/vela-artifacts
      - name: Build package and generate .SRCINFO as an unprivileged user
        run: |
          pacman -Syu --noconfirm --needed gtk3 webkit2gtk-4.1 alsa-lib libx11 libxtst libxinerama systemd-libs
          useradd -m builder
          mkdir -p /tmp/vela-aur
          cp /tmp/vela-artifacts/aur/PKGBUILD /tmp/vela-aur/
          cp /tmp/vela-artifacts/vela-music-bin-*.tar.gz /tmp/vela-aur/
          chown -R builder:builder /tmp/vela-aur
          su builder -c 'cd /tmp/vela-aur && makepkg --printsrcinfo > .SRCINFO && makepkg --noconfirm'
          /tmp/vela-aur/pkg/vela-music-bin/usr/bin/vela-desktop --version
          LD_LIBRARY_PATH=/tmp/vela-aur/pkg/vela-music-bin/usr/lib/vela ldd /tmp/vela-aur/pkg/vela-music-bin/usr/lib/vela/vela-desktop > /tmp/vela-aur/linked-libraries.txt
          if grep 'not found' /tmp/vela-aur/linked-libraries.txt; then exit 1; fi
          test -s /tmp/vela-aur/.SRCINFO
          bsdtar -tf /tmp/vela-aur/*.pkg.tar.zst | grep -x 'usr/bin/vela-desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: aur-validated
          path: |
            /tmp/vela-aur/PKGBUILD
            /tmp/vela-aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
  windows:
    name: Windows exe and zip
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The release scripts read the commit, the version and the tag from
          # the history, so a shallow copy is not enough.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-release.txt
      - run: python scripts/release_build.py --only desktop-windows-x86-64
      - name: Check executable and archive
        shell: pwsh
        run: |
          & .\target\release\vela-desktop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable failed' }
          python scripts/verify_release_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: target/release-artifacts/
          if-no-files-found: error
  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The release scripts read the commit, the version and the tag from
          # the history, so a shallow copy is not enough.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-release.txt
      - name: Install pinned Android and Dioxus tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          # The NDK names its compilers after the API level. The crates that
          # compile C code look for the plain target name, so it is provided,
          # and the toolchain directory is on the path for the following steps.
          ndk_bin="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for prefix in aarch64-linux-android armv7a-linux-androideabi x86_64-linux-android; do
            ln -sf "${prefix}26-clang" "$ndk_bin/${prefix}-clang"
            ln -sf "${prefix}26-clang++" "$ndk_bin/${prefix}-clang++"
          done
          echo "$ndk_bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/dioxus"
          gh release download v0.7.10 --repo DioxusLabs/dioxus --pattern dx-x86_64-unknown-linux-gnu.tar.gz --pattern dx-x86_64-unknown-linux-gnu.sha256 --dir "$RUNNER_TEMP/dioxus"
          cd "$RUNNER_TEMP/dioxus"
          sha256sum --ignore-missing -c dx-x86_64-unknown-linux-gnu.sha256
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          echo "$RUNNER_TEMP/dioxus" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build and verify installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-android
          path: target/release-artifacts/
          if-no-files-found: error
