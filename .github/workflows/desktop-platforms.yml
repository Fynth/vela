name: desktop-platforms
#
# Build the desktop client for every platform Vela targets.
#
# The Linux client is the one that exists today and is exercised by the native
# QA harness. Windows and macOS are built on their own native runners, because
# the TLS stack (ring) and the platform windowing libraries cannot be cross
# compiled from Linux. A job that cannot be built on its platform reports
# itself as such; it never turns into a green check for a binary that was never
# produced.
#
# The Android and iOS targets need the Dioxus mobile project layout and the
# platform SDKs. They are declared in release/targets.yaml as blocked, and this
# workflow reports them as blocked until those projects exist.

on:
  push:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-platforms.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  RUST_TOOLCHAIN: 1.99.0

jobs:
  linux:
    name: linux desktop (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libudev-dev libxdo-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p vela-desktop --all-targets --features native-qa -- -D warnings
      - run: cargo build --locked --release -p vela-desktop
      - name: Package and verify the desktop build
        run: |
          bash scripts/package-desktop-linux.sh
          python3 scripts/verify_desktop_package.py

  windows:
    name: windows desktop (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and package the Windows desktop client
        shell: bash
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 scripts/release_build.py --output target/release-artifacts --only desktop-windows-x86-64
      - name: Check the Windows binary runs
        shell: pwsh
        run: |
          & .\target\release\vela-desktop.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the Windows desktop binary did not report its version" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            target/release/vela-desktop.exe
            target/release-artifacts/*

  macos:
    name: macos desktop (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the release tooling dependencies
        run: python3 -m pip install --upgrade pyyaml
      - name: Build and package the macOS desktop client
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 scripts/release_build.py --output target/release-artifacts --only desktop-macos-aarch64
      - name: Check the macOS binary runs
        run: |
          ./target/release/vela-desktop --version
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            target/release/vela-desktop
            target/release-artifacts/*

  android:
    name: android client (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install the Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Prepare the Android toolchain
        # The NDK names its compilers after the API level, while the crates that
        # compile C code look for the plain target name. Both names are provided,
        # and the toolchain directory is put on the path for the crates that
        # look for the compiler by name.
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for prefix in aarch64-linux-android armv7a-linux-androideabi x86_64-linux-android; do
            ln -sf "${prefix}26-clang" "$bin/${prefix}-clang"
          done
          echo "$bin" >> "$GITHUB_PATH"
          cargo build --locked --release -p vela-desktop --bin vela-mobile --features mobile --target aarch64-linux-android
      - name: Check the Android binary
        run: |
          file target/aarch64-linux-android/release/vela-mobile
          # The client uses the platform audio stack, so the binary must ask for it.
          readelf -d target/aarch64-linux-android/release/vela-mobile | grep -q libaaudio.so
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-android
          path: target/aarch64-linux-android/release/vela-mobile

  ios:
    name: ios client (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build the iOS client
        run: |
          cargo build --locked --release -p vela-desktop --bin vela-mobile --features mobile --target aarch64-apple-ios
      - name: Check the iOS binary
        run: |
          file target/aarch64-apple-ios/release/vela-mobile
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ios
          path: target/aarch64-apple-ios/release/vela-mobile

  report:
    name: platform readiness
    needs: [linux, windows, macos, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the release tooling dependencies
        run: python3 -m pip install --upgrade pyyaml
      - name: Report what is built and what is still blocked
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, "scripts")
          from release_manifest import load, validate
          document = load(pathlib.Path("release/targets.yaml"))
          targets = validate(document)
          report = {
              "targets": [
                  {
                      "id": target["id"],
                      "platform": target["platform"],
                      "channel": target["channel"],
                      "status": target["status"],
                  }
                  for target in targets
              ],
              "linux": os.environ.get("LINUX_RESULT", "unknown"),
          }
          print(json.dumps(report, indent=2))
          PY
      - name: Upload the platform report
        uses: actions/upload-artifact@v4
        with:
          name: platform-readiness
          path: platform-report.json
          if-no-files-found: ignore
