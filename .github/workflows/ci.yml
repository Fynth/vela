name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=2
      - run: cargo build --locked --release -p vela-server
      - run: python3 scripts/verify_shutdown.py --runs 10 --worker-failure
      - run: cargo clippy --locked -p vela-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: scripts/build-web.sh
      - run: python3 scripts/generate_notices.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tests/browser
      - name: Install isolated browser engines
        run: cd tests/browser && npx playwright install --with-deps chromium firefox
      - name: Chromium real-server regression
        run: cd tests/browser && VELA_TEST_BINARY=target/release/vela-server npx playwright test --browser=chromium
      - name: Preserve Chromium evidence before the fresh Firefox run
        run: mv tests/browser/test-results tests/browser/chromium-results
      - name: Firefox real-server regression
        run: cd tests/browser && VELA_TEST_BINARY=target/release/vela-server npx playwright test --browser=firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            tests/browser/test-results
            tests/browser/chromium-results
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: EmbarkStudios/cargo-deny-action@v2
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
