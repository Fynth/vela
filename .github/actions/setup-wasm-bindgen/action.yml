name: Pinned wasm-bindgen CLI
description: Install the lockfile-matching Linux CLI without compiling a second dependency graph
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/vela-wasm-bindgen"
        gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/vela-wasm-bindgen"
        cd "$RUNNER_TEMP/vela-wasm-bindgen"
        echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz' | sha256sum -c
        tar -xzf wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz --strip-components=1
        echo "$RUNNER_TEMP/vela-wasm-bindgen" >> "$GITHUB_PATH"
