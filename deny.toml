[advisories]
version = 2
yanked = "deny"
# Current Lofty uses this compile-time macro; upstream has no safe upgrade.
# Review on each Lofty update. Do not ignore runtime vulnerability advisories.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Unmaintained compile-time paste macro via Lofty 0.25.4; no fixed upstream release. Tracked in SECURITY.md." }]

[licenses]
version = 2
allow = ["AGPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
